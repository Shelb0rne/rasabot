version: "3.1"

nlu:
  - intent: greet
    examples: |
      - привет
      - здравствуйте
      - добрый день
      - добрый вечер
      - приветствую


  - intent: goodbye
    examples: |
      - до свидания
      - пока
      - спасибо, до свидания
      - всего доброго
      - завершим
      - на этом все

  - intent: start_interview
    examples: |
      - перейдем к интервью
      - начнем интервью
      - давайте начнем интервью
      - я готов пройти интервью
      - хочу пройти собеседование
      - можно начать
      - теперь к делу

  - intent: provide_name
    examples: |
      - меня зовут [Игорь](name)
      - мое имя [Юрий](name)
      - я [Сергей Васильев](name)
      - [Володин Иван Аркадьевич](name)
      - [Анна](name)
      - зовите меня [Мария](name)
      - меня зовут [Алексей Петров](name)

  - intent: provide_role_interest
    examples: |
      - хочу на позицию [Project Manager](role)
      - рассматриваю роль [Data Analyst](role)
      - мне интересна позиция [Data Engineer](role)
      - хочу быть [Data Scientist](role)
      - подаюсь на [MLOps Engineer](role)
      - мне ближе роль [аналитика данных](role)
      - хочу работать [инженером данных](role)
      - интересует [ML-инфраструктура](role)
      - пока не знаю, какая роль мне подходит

  - intent: provide_experience
    examples: |
      - у меня [1](experience_years) год опыта
      - у меня [2](experience_years) года опыта
      - в IT я работаю [3](experience_years) года
      - опыт около [5](experience_years) лет
      - в аналитике работаю [4](experience_years) года
      - опыта почти нет
      - я начинающий специалист

  - intent: provide_skills
    examples: |
      - знаю [Python](skill), [SQL](skill) и [pandas](skill)
      - работал с [Airflow](skill) и [Spark](skill)
      - использовал [Docker](skill), [Kubernetes](skill) и [MLflow](skill)
      - умею делать дашборды в [Power BI](skill)
      - работал с [Tableau](skill), [SQL](skill) и метриками
      - знаю [sklearn](skill), [PyTorch](skill), [TensorFlow](skill)
      - управлял задачами в [Jira](skill), работал по [Scrum](skill)

  - intent: provide_project_experience
    examples: |
      - я участвовал в проекте по прогнозированию спроса
      - делал ETL-пайплайн для сбора данных из нескольких источников
      - строил модель классификации клиентов
      - занимался аналитикой продаж и готовил отчеты для бизнеса
      - координировал команду разработки ML-сервиса
      - настраивал деплой модели и мониторинг качества
      - релевантных проектов пока не было

  - intent: answer_pm_question
    examples: |
      - я вел план проекта, распределял задачи и контролировал сроки
      - общался с бизнесом и собирал требования
      - работал со стейкхолдерами и согласовывал roadmap
      - проводил планирование спринтов и ретроспективы
      - управлял командой аналитиков и разработчиков

  - intent: answer_da_question
    examples: |
      - я анализировал данные, строил метрики и дашборды
      - писал SQL-запросы и готовил отчеты для бизнеса
      - проводил A/B-тесты и интерпретировал результаты
      - формулировал бизнес-требования на основе данных
      - искал закономерности в данных и объяснял выводы команде

  - intent: answer_de_question
    examples: |
      - я создавал пайплайны загрузки и обработки данных
      - настраивал Airflow DAG для регулярной обработки данных
      - работал с хранилищами данных и оптимизировал SQL
      - использовал Spark для обработки больших объемов данных
      - отвечал за качество данных и стабильность ETL

  - intent: answer_ds_question
    examples: |
      - я обучал ML-модели и сравнивал качество по метрикам
      - делал feature engineering и улучшал модель
      - работал с sklearn и градиентным бустингом
      - строил модели классификации и регрессии
      - проводил эксперименты и валидировал гипотезы

  - intent: answer_mlops_question
    examples: |
      - я деплоил модели в production
      - настраивал Docker и Kubernetes для ML-сервисов
      - использовал MLflow для трекинга экспериментов
      - делал CI/CD для сервиса с моделью
      - настраивал мониторинг качества модели и инфраструктуры

  - intent: answer_soft_skills
    examples: |
      - я регулярно общался с заказчиком и уточнял требования
      - помогал команде договариваться по приоритетам
      - презентовал результаты анализа бизнесу
      - умею объяснять технические решения простым языком
      - работал в команде с аналитиками, инженерами и менеджерами

  - intent: dont_know
    examples: |
      - не знаю
      - затрудняюсь ответить
      - не могу сказать
      - пока не понимаю
      - не уверен
      - у меня нет такого опыта

  - intent: deny
    examples: |
      - нет
      - не было
      - такого опыта нет
      - я этим не занимался
      - не работал с этим
      - скорее нет

  - intent: affirm
    examples: |
      - да
      - верно
      - конечно
      - все правильно
      - да, продолжим
      - согласен

  - intent: out_of_scope
    examples: |
      - какая сегодня погода
      - расскажи анекдот
      - сколько стоит биткоин
      - помоги написать диплом
      - закажи мне пиццу
      - хочу поговорить не про работу

  - synonym: project_manager
    examples: |
      - Project Manager
      - PM
      - проджект менеджер
      - менеджер проекта

  - synonym: data_analyst
    examples: |
      - Data Analyst
      - аналитик данных
      - дата аналитик
      - аналитик

  - synonym: data_engineer
    examples: |
      - Data Engineer
      - инженер данных
      - дата инженер

  - synonym: data_scientist
    examples: |
      - Data Scientist
      - DS
      - ML engineer
      - специалист по машинному обучению

  - synonym: mlops_engineer
    examples: |
      - MLOps Engineer
      - MLOps
      - ML-инфраструктура
      - инженер ML-инфраструктуры
