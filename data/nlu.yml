  - intent: answer_pm_question
    examples: |
      - я вел план проекта, распределял задачи и контролировал сроки
      - общался с бизнесом и собирал требования
      - работал со стейкхолдерами и согласовывал roadmap
      - проводил планирование спринтов и ретроспективы
      - управлял командой аналитиков и разработчиков
      - вел backlog, roadmap, риски и статус проекта
      - контролировал сроки, зависимости и ожидания стейкхолдеров
      - если модель не готова, я согласую MVP, риски и новый scope
      - при конфликте срока и качества сначала покажу бизнесу риски и варианты
      - зафиксирую приоритеты, договорюсь о компромиссе и плане релиза
      - использовал Jira, sprint planning и регулярные синки с командой
      - вел коммуникацию между бизнесом, аналитиками и ML-разработчиками

  - intent: answer_da_question
    examples: |
      - я анализировал данные, строил метрики и дашборды
      - писал SQL-запросы и готовил отчеты для бизнеса
      - проводил A/B-тесты и интерпретировал результаты
      - формулировал бизнес-требования на основе данных
      - искал закономерности в данных и объяснял выводы команде
      - проверю конверсию, воронку, сегменты, когорты и retention
      - построю SQL-запросы и дашборд по ключевым метрикам
      - для проверки гипотезы запущу A/B тест с контрольной группой
      - оценю статистическую значимость, p-value и размер выборки
      - сравню тестовую и контрольную группы по основной метрике
      - посмотрю выручку, средний чек, churn и поведение пользователей
      - сформулирую выводы и рекомендации для бизнеса

  - intent: answer_de_question
    examples: |
      - я создавал пайплайны загрузки и обработки данных
      - настраивал Airflow DAG для регулярной обработки данных
      - работал с хранилищами данных и оптимизировал SQL
      - использовал Spark для обработки больших объемов данных
      - отвечал за качество данных и стабильность ETL
      - пайплайн состоит из extract, transform, load, расписания и проверок качества
      - добавлю логирование, ретраи, алерты и мониторинг DAG
      - при ночном падении проверю логи, схему данных и доступность источника
      - проверю изменения в source-системе и качество входных данных
      - настрою retry policy и уведомления об ошибках
      - проектировал хранилище и витрины данных для аналитиков
      - работал с Airflow, Kafka, Spark и ClickHouse

  - intent: answer_ds_question
    examples: |
      - я обучал ML-модели и сравнивал качество по метрикам
      - делал feature engineering и улучшал модель
      - работал с sklearn и градиентным бустингом
      - строил модели классификации и регрессии
      - проводил эксперименты и валидировал гипотезы
      - при дисбалансе классов смотрел бы precision, recall, F1 и PR-AUC
      - использую ROC-AUC, PR-AUC и confusion matrix
      - если модель переобучается, проверю валидацию и data leakage
      - добавлю регуляризацию, уменьшу сложность модели и проверю признаки
      - использовал cross-validation и отложенную тестовую выборку
      - сравнивал baseline, CatBoost и нейросетевые модели
      - улучшал качество через feature engineering и подбор гиперпараметров

  - intent: answer_mlops_question
    examples: |
      - я деплоил модели в production
      - настраивал Docker и Kubernetes для ML-сервисов
      - использовал MLflow для трекинга экспериментов
      - делал CI/CD для сервиса с моделью
      - настраивал мониторинг качества модели и инфраструктуры
      - для деплоя нужны Docker, CI/CD, registry, мониторинг и rollback
      - упакую модель в контейнер и настрою безопасный релиз
      - использовал Kubernetes, Helm и autoscaling для сервиса
      - после релиза мониторю latency, ошибки, drift и качество модели
      - настрою алерты на падение качества и деградацию данных
      - использовал MLflow model registry и версионирование моделей
      - делал canary release и возможность быстрого отката

