version: "3.1"

rules:
  - rule: Greet user
    steps:
      - intent: greet
      - action: utter_greet

  - rule: Start interview form
    steps:
      - intent: start_interview
      - action: utter_start_interview
      - action: interview_form
      - active_loop: interview_form

  - rule: Submit interview form
    condition:
      - active_loop: interview_form
    steps:
      - action: interview_form
      - active_loop: null
      - action: action_evaluate_candidate

  - rule: Say goodbye
    steps:
      - intent: goodbye
      - action: utter_goodbye

  - rule: Handle out of scope
    steps:
      - intent: out_of_scope
      - action: utter_out_of_scope

  - rule: Handle denial outside form
    condition:
      - active_loop: null
    steps:
      - intent: deny
      - action: utter_deny

  - rule: Handle unknown answer outside form
    condition:
      - active_loop: null
    steps:
      - intent: dont_know
      - action: utter_dont_know
