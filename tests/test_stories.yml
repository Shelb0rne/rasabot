version: "3.1"

stories:
  - story: candidate interview happy path
    steps:
      - user: |
          начнем интервью
        intent: start_interview
      - action: utter_start_interview
      - action: interview_form
      - active_loop: interview_form
      - slot_was_set:
          - requested_slot: candidate_name
      - user: |
          меня зовут Анна
        intent: provide_name
      - action: interview_form
      - slot_was_set:
          - requested_slot: desired_role
      - user: |
          хочу на позицию Data Scientist
        intent: provide_role_interest
      - action: interview_form
      - slot_was_set:
          - requested_slot: experience_years
      - user: |
          у меня 3 года опыта
        intent: provide_experience
      - action: interview_form
      - slot_was_set:
          - requested_slot: expected_salary
      - user: |
          ожидаю 200 тысяч рублей
        intent: provide_salary
      - action: interview_form
      - slot_was_set:
          - requested_slot: skills
      - user: |
          знаю Python, SQL, sklearn и PyTorch
        intent: provide_skills
      - action: interview_form
      - slot_was_set:
          - requested_slot: project_experience
      - user: |
          строила модель классификации клиентов
        intent: provide_project_experience
      - action: interview_form
      - slot_was_set:
          - requested_slot: role_specific_answer_1
      - user: |
          для дисбаланса классов выберу precision, recall, F1 и PR-AUC
        intent: answer_ds_question
      - action: interview_form
      - slot_was_set:
          - requested_slot: role_specific_answer_2
      - user: |
          проверю валидацию и утечку данных, добавлю регуляризацию и упрощу модель
        intent: answer_ds_question
      - action: interview_form
      - slot_was_set:
          - requested_slot: technical_experience
      - user: |
          обучала ML-модели и сравнивала качество по метрикам
        intent: answer_ds_question
      - action: interview_form
      - slot_was_set:
          - requested_slot: business_experience
      - user: |
          презентовала результаты анализа бизнесу
        intent: answer_soft_skills
      - action: interview_form
      - active_loop: null
      - action: action_evaluate_candidate

  - story: candidate rejected because experience is too low
    steps:
      - user: |
          начнем интервью
        intent: start_interview
      - action: utter_start_interview
      - action: interview_form
      - active_loop: interview_form
      - slot_was_set:
          - requested_slot: candidate_name
      - user: |
          меня зовут Иван
        intent: provide_name
      - action: interview_form
      - slot_was_set:
          - requested_slot: desired_role
      - user: |
          хочу на позицию Data Analyst
        intent: provide_role_interest
      - action: interview_form
      - slot_was_set:
          - requested_slot: experience_years
      - user: |
          опыта почти нет
        intent: provide_experience
      - action: interview_form
      - active_loop: null
      - action: action_evaluate_candidate

  - story: candidate says goodbye
    steps:
      - user: |
          до свидания
        intent: goodbye
      - action: utter_goodbye
